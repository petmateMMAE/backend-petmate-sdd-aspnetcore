# CI de pull request (pm-055, pm-057, pm-058, pm-060).
# Paridad con el gate local: ejecuta scripts/quality-gate.ps1 (restore, build+SAST, formato, NuGet,
# licencias y las 4 suites) más el gate de integridad SDD, el escaneo de la imagen y el SBOM.
# Herramientas $0: runners de GitHub, Trivy y Syft (licencias Apache-2.0).
name: CI

on:
  pull_request:
    branches: [developer, release, main]
  push:
    branches: [developer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Gate de calidad (SDD, SAST, NuGet, pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MONGODB_TEST_URI: ${{ secrets.MONGODB_TEST_URI }}
      MONGODB_TEST_DATABASE: ${{ secrets.MONGODB_TEST_DATABASE }}
      MONGODB_DATABASE: petmate_ci_no_usar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Integridad SDD (check-sdd.ps1)
        shell: pwsh
        run: ./scripts/check-sdd.ps1

      - name: Exigir credenciales de la base de pruebas
        # Sin ellas las pruebas de integración quedarían Skipped y no cuentan como aprobadas (AGENTS.md §6).
        run: |
          if [ -z "$MONGODB_TEST_URI" ] || [ -z "$MONGODB_TEST_DATABASE" ]; then
            echo "::error::Faltan los secretos MONGODB_TEST_URI / MONGODB_TEST_DATABASE"; exit 1
          fi

      - name: Redis Auth y Redis Cache de prueba (contenedores efímeros)
        run: |
          AUTH_PW=$(openssl rand -hex 24); CACHE_PW=$(openssl rand -hex 24)
          echo "::add-mask::$AUTH_PW"; echo "::add-mask::$CACHE_PW"
          docker run -d --name redis-auth -p 6381:6379 redis:7.4 redis-server --requirepass "$AUTH_PW" --maxmemory-policy noeviction
          docker run -d --name redis-cache -p 6382:6379 redis:7.4 redis-server --requirepass "$CACHE_PW" --maxmemory-policy allkeys-lru
          echo "PETMATE_IT_REDIS_AUTH=localhost:6381,password=$AUTH_PW" >> "$GITHUB_ENV"
          echo "PETMATE_IT_REDIS_CACHE=localhost:6382,password=$CACHE_PW" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            docker exec redis-auth redis-cli -a "$AUTH_PW" ping 2>/dev/null | grep -q PONG && \
            docker exec redis-cache redis-cli -a "$CACHE_PW" ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done

      - name: Gate de calidad (paridad con scripts/quality-gate.ps1)
        shell: pwsh
        run: ./scripts/quality-gate.ps1 -HostTests

  image:
    name: Imagen, escaneo y SBOM
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t petmate-api:ci-${{ github.sha }} .

      - name: Escaneo de la imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: petmate-api:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: petmate-api:ci-${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-petmate-api-${{ github.sha }}.spdx.json
