# Creación y eliminación de la infraestructura como paso del pipeline (requisito 15 de los lineamientos,
# pm-066, pm-067, pm-083). Solo se ejecuta a mano, desde `main` y por alguien con permiso de escritura (el plan
# gratuito de GitHub no permite environments con revisores en repositorios privados).
# - plan    : muestra los cambios, no crea nada.
# - apply   : crea/actualiza Azure y luego la lista de acceso de Atlas.
# - destroy : quita primero las IPs de Atlas y después todo lo de Azure. No toca datos de Atlas,
#             ni el grupo de recursos (lo creó bootstrap), ni el estado de Terraform.
name: Infraestructura

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'plan | apply | destroy'
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirm:
        description: 'Para destroy escribe: destruir-petmate'
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-production
  cancel-in-progress: false

env:
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_resource_group_name: ${{ vars.APP_RESOURCE_GROUP }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_mongodb_uri: ${{ secrets.TF_MONGODB_URI }}
  TF_VAR_jwt_signing_key: ${{ secrets.TF_JWT_SIGNING_KEY }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_trusted_proxies: ${{ vars.TRUSTED_PROXIES }}
  # Modo ahorro (pruebas) por defecto; para la evaluación crear la variable MODO_AHORRO=false y aplicar.
  TF_VAR_modo_ahorro: ${{ vars.MODO_AHORRO || 'true' }}
  TF_VAR_atlas_project_id: ${{ secrets.ATLAS_PROJECT_ID }}
  TF_VAR_state_resource_group_name: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TF_VAR_state_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
  MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Confirmación de destroy
        if: inputs.action == 'destroy' && inputs.confirm != 'destruir-petmate'
        run: |
          echo "::error::Para destruir escribe exactamente 'destruir-petmate' en confirm."; exit 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        run: |
          for dir in infra/azure infra/atlas; do
            terraform -chdir=$dir init -input=false \
              -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
              -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
              -backend-config="container_name=tfstate"
          done
          terraform -chdir=infra/azure validate
          terraform -chdir=infra/atlas validate

      - name: Plan
        if: inputs.action == 'plan'
        run: terraform -chdir=infra/azure plan -input=false

      - name: Apply (Azure y después Atlas)
        if: inputs.action == 'apply'
        run: |
          terraform -chdir=infra/azure apply -input=false -auto-approve
          terraform -chdir=infra/atlas apply -input=false -auto-approve
          echo "URL: $(terraform -chdir=infra/azure output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy (Atlas primero, después Azure)
        if: inputs.action == 'destroy'
        run: |
          terraform -chdir=infra/atlas destroy -input=false -auto-approve
          terraform -chdir=infra/azure destroy -input=false -auto-approve
