# Configuración de gitleaks para el job `secrets-scan` del pipeline (pm-019, pm-055).
# Se usan las reglas por defecto y solo se excluyen los falsos positivos revisados, archivo por archivo (no carpetas completas):
#   - Constantes y valores ficticios de pruebas (claves de prueba que solo existen en el entorno aislado de las pruebas y jamás
#     coinciden con una credencial real).
#   - Argon2idOptions.cs: nombres de variables de configuración (p. ej. "ARGON2_MAX_CONCURRENCY"), no valores.
# Cualquier archivo nuevo que dispare una regla debe revisarse; solo si es un falso positivo se agrega aquí con su motivo.
# Los secretos reales se guardan en GitHub Secrets / Azure y nunca en el repositorio.
title = "PetMate gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos revisados (valores ficticios de pruebas y nombres de variables de configuración)"
paths = [
  '''tests/PetMate\.ContractTests/Support/IsolatedApiFactory\.cs''',
  '''tests/PetMate\.ContractTests/Users/UserProfileEndpointsTests\.cs''',
  '''tests/PetMate\.SecurityTests/Authentication/JwtAccessTokenServiceTests\.cs''',
  '''tests/PetMate\.SecurityTests/Quality/SecretScanTests\.cs''',
  '''src/PetMate\.Infrastructure/Security/Argon2idOptions\.cs''',
  # Primer hito (T103-T108): contrasenas ficticias de pruebas y del script de aceptacion, nunca credenciales reales.
  '''tests/PetMate\.ContractTests/Authentication/AuthEndpointValidationTests\.cs''',
  '''tests/PetMate\.ContractTests/Authentication/PasswordResetEndpointsTests\.cs''',
  '''tests/PetMate\.UnitTests/Authentication/PasswordResetTests\.cs''',
  '''scripts/acceptance-milestone\.ps1''',
  # Hito 2 (T123-T167): contrasena ficticia de las pruebas de contrato de negocios y veterinaria.
  '''tests/PetMate\.ContractTests/Businesses/MapAndAccessEndpointsTests\.cs''',
  '''tests/PetMate\.ContractTests/Businesses/VeterinaryEndpointsTests\.cs''',
]
